<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHANGE-ME</title>
  <meta name="description" content="One sentence about what this app does.">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1b1b1b;
      --muted: #5f5f5f;
      --accent: #1f5fbf;
      --line: #e3e3e3;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 .5rem; }
    p.lede { color: var(--muted); margin: 0 0 2rem; }
    button {
      font: inherit;
      padding: .75rem 1.25rem;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    #status { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>CHANGE-ME</h1>
    <p class="lede">Replace this with one sentence that tells a neighbor what this app does.</p>

    <button id="go" type="button">Load data</button>

    <section id="status" aria-live="polite">Nothing loaded yet. Tap the button to start.</section>
  </main>

  <script>
    // Example: Chicago Data Portal (SODA) request. Replace the dataset id and filter.
    const DATASET = 'v6vf-nfxy'; // 311 service requests
    const WARD = 44;

    async function load() {
      const status = document.getElementById('status');
      status.textContent = 'Loading...';
      try {
        const url = `https://data.cityofchicago.org/resource/${DATASET}.json?$where=ward=${WARD}&$limit=5`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rows = await res.json();
        status.textContent = rows.length
          ? `Loaded ${rows.length} rows from Ward ${WARD}.`
          : `No rows came back for Ward ${WARD}. Try a different filter.`;
      } catch (err) {
        status.textContent = `Could not reach the data portal (${err.message}). Check your connection and try again.`;
      }
    }

    document.getElementById('go').addEventListener('click', load);
  </script>
</body>
</html>
